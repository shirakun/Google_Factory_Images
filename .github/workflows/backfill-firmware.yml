name: Backfill Firmware to Releases

# Full-scan upload of all firmware in FactoryImages.txt / FullOTAImages.txt.
# Run once to populate GitHub Releases with historical firmware not captured by
# the incremental publish-firmware-orchestrator.yml pipeline.
# Safe to re-run: publish-firmware.sh skips already-uploaded assets.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, no downloads/uploads)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: firmware-backfill
  cancel-in-progress: false

jobs:
  detect-all:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}

    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Build full device matrix
        id: matrix
        run: |
          chmod +x .github/scripts/extract-changed-devices.sh
          devices_json="$(.github/scripts/extract-changed-devices.sh --all)"

          factory_devices_json=$(sed -nE 's#^https://dl\.google\.com/dl/android/aosp/([a-z0-9._]+)-[A-Za-z0-9._]+-factory-[0-9a-f]{8}\.zip\r?$#\1#p' FactoryImages.txt | LC_ALL=C sort -u | jq -Rsc 'split("\n") | map(select(length > 0))')
          ota_devices_json=$(sed -nE 's#^https://dl\.google\.com/dl/android/aosp/([a-z0-9._]+)-ota-[A-Za-z0-9._]+-[0-9a-f]{8}\.zip\r?$#\1#p' FullOTAImages.txt | LC_ALL=C sort -u | jq -Rsc 'split("\n") | map(select(length > 0))')

          matrix="$(jq -cn \
            --argjson devices        "$devices_json" \
            --argjson factory_devices "$factory_devices_json" \
            --argjson ota_devices     "$ota_devices_json" \
            '{
              include: [
                $devices[] as $device
                | ["factory", "ota"][] as $type
                | select(
                    if $type == "factory"
                    then ($factory_devices | index($device)) != null
                    else ($ota_devices     | index($device)) != null
                    end
                  )
                | {device: $device, type: $type}
              ]
            }')"
          count=$(jq '.include | length' <<< "$matrix")

          echo "Detected $count device/type pairs for backfill"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count"   >> "$GITHUB_OUTPUT"

  publish-device:
    needs: detect-all
    if: needs.detect-all.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.detect-all.outputs.matrix) }}
    uses: ./.github/workflows/publish-firmware.yml
    with:
      device_filter: ${{ matrix.device }}
      type_filter: ${{ matrix.type }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
